<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi nenito lindo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff9c4, #fff59d, #ffee58);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.92);
            padding: 22px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cat-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #f57f17;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 {
            color: #f57f17;
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #e65100;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }

        /* Flores flotantes */
        .floating-flower {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 4s linear infinite;
            z-index: 2;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Confeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
            }
        }
    </style>
</head>
<body>

    <!-- Música de fondo: Reproduce el archivo mp3 que subas a GitHub -->
    <audio autoplay loop>
        <source src="standbyme.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <div class="container">
        <img src="https://i.ibb.co/F43fqXsG/60a737db26da109e989e737efd1058ff.jpg" alt="Gatito con flores amarillas" class="cat-img">
        <h1>¡Feliz día de las flores amarillas!</h1>
        <p>Mi nenito lindo hermoso 💛</p>
    </div>

    <script>
        // Función para crear muchas flores amarillas flotantes
        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('floating-flower');
            const flowersArray = ['🌻', '🌼', '💛', '✨'];
            flower.innerHTML = flowersArray[Math.floor(Math.random() * flowersArray.length)];
            
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
            
            const duration = Math.random() * 3 + 2.5;
            flower.style.animationDuration = duration + 's';

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        setInterval(createFlower, 150);

        // Función para crear lluvia de confeti
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            const colors = ['#ffeb3b', '#ffc107', '#ff9800', '#e91e63', '#03a9f4', '#4caf50', '#9c27b0'];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.width = (Math.random() * 8 + 6) + 'px';
            confetti.style.height = (Math.random() * 8 + 6) + 'px';
            
            const duration = Math.random() * 3 + 2;
            confetti.style.animationDuration = duration + 's';

            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, duration * 1000);
        }

        setInterval(createConfetti, 100);
    </script>
</body>
</html>
